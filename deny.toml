# cargo-deny policy — supply chain security
# Plan v2 Section 15.2 — Run via: cargo deny check

[graph]
# Windows-first pivot (temporary — macOS targets re-add when Phase 2 macOS loopback
# work resumes). Windows MSVC is primary build target.
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-pc-windows-msvc" },
    # Kept compiling under deny check so cross-platform deps surface CVEs/license issues:
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"
unsound = "deny"
yanked = "deny"
notice = "warn"
ignore = []

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
]
copyleft = "warn"  # Allow case-by-case via exceptions below
default = "deny"
confidence-threshold = 0.93

# Slint dual-licensed — accepting GPL-3.0 for OSS core
# (Pro tier commercial requires separate Slint Royalty-free license)
[[licenses.exceptions]]
name = "slint"
allow = ["GPL-3.0"]

[[licenses.exceptions]]
name = "slint-build"
allow = ["GPL-3.0"]

[[licenses.exceptions]]
name = "i-slint-core"
allow = ["GPL-3.0"]

[[licenses.exceptions]]
name = "i-slint-renderer-skia"
allow = ["GPL-3.0"]

[[licenses.exceptions]]
name = "i-slint-renderer-software"
allow = ["GPL-3.0"]

[[licenses.exceptions]]
name = "i-slint-common"
allow = ["GPL-3.0"]

[[licenses.exceptions]]
name = "i-slint-compiler"
allow = ["GPL-3.0"]

[[licenses.exceptions]]
name = "i-slint-backend-selector"
allow = ["GPL-3.0"]

[[licenses.exceptions]]
name = "i-slint-backend-winit"
allow = ["GPL-3.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
