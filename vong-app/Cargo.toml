[package]
name = "vong-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Vọng AI Recorder — desktop audio recording + multilingual transcription"

[[bin]]
name = "vong"
path = "src/main.rs"

# Opt-in features cascade from vong-transcribe. To build the GPU release on Windows:
#   $env:VULKAN_SDK = "C:\VulkanSDK\<ver>"
#   $env:CMAKE_GENERATOR = "Ninja"          # VS 2026 MSBuild + vulkan-shaders-gen broken
#   cargo build --release --bin vong --features vulkan
[features]
default = []
vulkan = ["vong-transcribe/vulkan"]

[dependencies]
slint = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"        # Production crash log to file (GUI app stderr invisible)
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Phase 3 wizard — API key test (WS ping to Soniox / OpenAI).
# Same pinned versions as vong-transcribe to share a single compiled copy.
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }

# Phase 1 + 3 + 4 + 6 wired: mic capture → VAD → Whisper local STT → SQLite storage.
vong-audio = { workspace = true }
vong-transcribe = { workspace = true }
vong-storage = { workspace = true }
rtrb = "0.3"      # Ring buffer (we hold consumer side; resampler wiring comes Phase 1 proper)
cpal = "0.17"     # For DeviceTrait::name() display in UI
directories = "6" # Audio source preference config path (%APPDATA%\Vong\Vong AI Recorder\config\)

# Phase 9: Crash reporting (Sentry) — opt-in, privacy-scrubbed.
# default-features = false to exclude debug-images (~120 KB) + curl transport.
# rustls TLS avoids linking schannel/openssl natively.
sentry = { version = "0.34", default-features = false, features = [
    "backtrace",   # symbol resolution for stack frames
    "contexts",    # device + OS context auto-collection
    "panic",       # std::panic hook integration (sentry-panic sub-crate)
    "transport",   # required by all HTTP transports
    "reqwest",     # use reqwest HTTP transport (already vendored by vong-transcribe)
    "rustls",      # rustls TLS — avoids linking schannel/openssl
] }
sentry-tracing = "0.34"  # bridges tracing macros → Sentry breadcrumbs / events

# Phase 5 (partial) — system tray icon + global hotkey. Cross-platform Win + Mac + Linux.
tray-icon = "0.24"      # System tray + menu
global-hotkey = "0.8"   # Ctrl+Shift+R toggle window visibility
muda = "0.19"           # Menu items used by tray-icon

# Future phases:
# vong-ui = { workspace = true }

[package.metadata.wix]
# cargo-wix configuration — do not remove this section.
# UpgradeCode MUST remain stable across all releases.
# See: wix/main.wxs for the committed template.
upgrade-guid = "FFC0DF45-51D5-45F8-A336-A5113CAFC06D"
path-guid = "0F4C24A4-878D-477B-A38D-DBFAE84D5AB8"
license = false
eula = false

[dev-dependencies]
tempfile = "3"        # Temporary directories for dictionary_test.rs file I/O tests

[build-dependencies]
slint-build = "1.7"

# Embed the multi-size ICO (assets/icon.ico) into the Windows exe's PE
# resource section so File Explorer / taskbar / Alt-Tab shows the branded
# icon. `winresource` is the maintained fork of `winres` and works with
# modern toolchains (Rust 1.78+, MSVC 2022/2026).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
