[package]
name = "vong-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Vọng audio capture + mixing + VAD pipeline (Phase 1-3)"

[lib]
name = "vong_audio"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }

# Phase 1 — Mic capture pipeline
cpal = "0.17"                          # Cross-platform audio I/O (latest as of 2026-05)
audio_thread_priority = "0.35"         # Promote audio thread RT (RustAudio)
rtrb = "0.3"                           # Lock-free SPSC ring buffer
rubato = "0.16"                        # Sinc interpolation resampler (last 0.x — 2.0 has breaking API)

# Phase 2+ (deferred):
# screencapturekit = "2.1"   # macOS only (#[cfg(target_os = "macos")])

# Phase 3 — VAD + utterance state machine
earshot = "1.1"                        # Pure Rust VAD (pykeio) — RTF 0.0007, no_std
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
hound = "3.5"                          # WAV file I/O for integration tests
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
serde_json = { workspace = true }      # for vad.rs Serialize/Deserialize roundtrip tests
