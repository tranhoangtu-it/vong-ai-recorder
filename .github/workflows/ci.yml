name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# NOTE: the GitHub repo IS the `app/` workspace (no nested `app/` subdir).
# So every step runs at the checkout root — no `working-directory: app`.

jobs:
  build-windows:
    name: Build & Test (Windows — primary)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build release (default CPU-only)
        run: cargo build --workspace --release

      - name: Run tests
        run: cargo test --workspace

      - name: Verify binary size (<15 MB target)
        shell: pwsh
        run: |
          $size = (Get-Item target\release\vong.exe).Length
          Write-Output "Binary size: $size bytes ($([math]::Round($size/1MB,1)) MB)"
          if ($size -gt 15728640) {
            Write-Output "::error::Binary size $size exceeds 15 MB target"
            exit 1
          }

  build-macos:
    name: Build (macOS — scaffolding only, paused)
    runs-on: macos-latest
    # Windows-first pivot: macOS feature work paused, but cross-compile sanity
    # check keeps `#[cfg(target_os = "macos")]` gates honest.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace

  security:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit + cargo-deny
        run: |
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny

      - name: Cargo audit (CVE check)
        # Default policy: fail on `vulnerability` + `unsound` + `yanked`.
        # `unmaintained` is informational only — many transitive deps (bincode,
        # proc-macro-error, etc.) are technically unmaintained but not CVE-bearing.
        run: cargo audit

      - name: Cargo deny (license + policy)
        run: cargo deny check
