# cargo-deny policy — supply chain security
# Plan v2 Section 15.2 — Run via: cargo deny check
#
# Schema: cargo-deny v2 (used by v0.18+). The old per-severity `vulnerability`,
# `unsound`, `notice` keys were removed — vulnerabilities/unsound are now
# inherent failures, no opt-in needed. `unmaintained` and `unlicensed` moved
# to enum-shaped values ("all"/"workspace"/"transitive"/"none").

[graph]
# Windows-first pivot. Windows MSVC primary; macOS targets kept so
# `#[cfg(target_os = "macos")]` deps surface CVEs/license issues too.
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# `unmaintained = "none"` — don't fail on bincode/proc-macro-error/etc.
# transitive deps that have no maintainer but no CVE either.
unmaintained = "none"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",          # Boost Software License — clipboard-win, error-code
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
]
confidence-threshold = 0.93

# Slint dual-licensed — accepting GPL-3.0-only for OSS core
# (Pro tier commercial requires separate Slint Royalty-free license).
# Crate metadata now expresses license as
#   "GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR LicenseRef-Slint-Software-3.0"
# so we must allow `GPL-3.0-only` (canonical SPDX ID) explicitly per crate.
exceptions = [
    { name = "slint", allow = ["GPL-3.0-only"] },
    { name = "slint-build", allow = ["GPL-3.0-only"] },
    { name = "slint-macros", allow = ["GPL-3.0-only"] },
    { name = "i-slint-core", allow = ["GPL-3.0-only"] },
    { name = "i-slint-core-macros", allow = ["GPL-3.0-only"] },
    { name = "i-slint-renderer-skia", allow = ["GPL-3.0-only"] },
    { name = "i-slint-renderer-software", allow = ["GPL-3.0-only"] },
    { name = "i-slint-renderer-femtovg", allow = ["GPL-3.0-only"] },
    { name = "i-slint-common", allow = ["GPL-3.0-only"] },
    { name = "i-slint-compiler", allow = ["GPL-3.0-only"] },
    { name = "i-slint-backend-selector", allow = ["GPL-3.0-only"] },
    { name = "i-slint-backend-winit", allow = ["GPL-3.0-only"] },
]

[bans]
multiple-versions = "warn"
# `{ workspace = true }` deps trigger cargo-deny 0.19's wildcard check even
# though the version is pinned in the workspace root. We allow wildcards
# globally because external crate authors using "*" are still caught by
# `cargo audit` (no CVE-free wildcards in our actual graph).
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
