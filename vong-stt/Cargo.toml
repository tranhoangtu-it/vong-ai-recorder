[package]
name = "vong-stt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Vọng Speech-to-Text providers (Soniox WebSocket, future OpenAI/Google)"

[lib]
name = "vong_stt"
path = "src/lib.rs"

# Opt-in features. Default keeps build CPU-only (no extra system deps).
# `vulkan` enables whisper.cpp Vulkan backend — requires Vulkan SDK
# at build time (VULKAN_SDK env var) and a Vulkan-capable GPU at runtime.
[features]
default = []
vulkan = ["whisper-rs/vulkan"]

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Phase 4 — Soniox WebSocket integration
async-trait = "0.1"
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
keyring = "3.6"           # Pinned 3.x — 4.0 has breaking API (Entry moved)
secrecy = "0.10"
zeroize = "1"             # Zeroizing<String> wrapper for JSON containing api_key
base64 = "0.22"           # OpenAI Realtime input_audio_buffer.append uses base64 PCM

# Phase 4 local — whisper.cpp via Rust bindings. Compiled from C source on first
# build (needs cmake + MSVC on Windows). Default = CPU-only. Opt-in GPU via
# the `vulkan` feature on this crate (cascades to whisper-rs/vulkan).
# Pinned 0.16 — earlier 0.14 had bindings/struct-size mismatch on MSVC.
whisper-rs = { version = "0.16", default-features = false }
directories = "6"         # Cross-platform AppData / model storage discovery

# Internal: shared types (Utterance struct from audio crate)
vong-audio = { workspace = true }
