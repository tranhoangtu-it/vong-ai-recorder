name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# NOTE: the GitHub repo IS the `app/` workspace (no nested `app/` subdir).
# So every step runs at the checkout root — no `working-directory: app`.

jobs:
  release-windows:
    name: Build Windows release artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release (CPU only)
        run: cargo build --workspace --release

      - name: Verify binary size
        shell: pwsh
        run: |
          $size = (Get-Item target\release\vong.exe).Length
          Write-Output "CPU binary size: $([math]::Round($size/1MB,1)) MB"

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      - name: Install WiX Toolset
        run: choco install wixtoolset --confirm --no-progress

      - name: Initialize WiX config (first run)
        shell: pwsh
        run: |
          if (-not (Test-Path wix\main.wxs)) {
            cargo wix init --force
          }

      - name: Build MSI installer
        run: cargo wix --no-build --nocapture

      - name: List release artifacts
        shell: pwsh
        run: |
          Get-ChildItem target\wix -Filter "*.msi" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output "$($_.Name) — $([math]::Round($_.Length/1MB,1)) MB"
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vong-windows-release
          path: |
            target/release/vong.exe
            target/wix/*.msi
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/vong.exe
            target/wix/*.msi
          draft: true
          prerelease: true
          generate_release_notes: true
