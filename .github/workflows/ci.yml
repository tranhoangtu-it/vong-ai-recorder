name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-windows:
    name: Build & Test (Windows — primary)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        working-directory: app
        run: cargo fmt --all -- --check

      - name: Clippy lint
        working-directory: app
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build release (default CPU-only)
        working-directory: app
        run: cargo build --workspace --release

      - name: Run tests
        working-directory: app
        run: cargo test --workspace

      - name: Verify binary size (<15 MB target)
        working-directory: app
        shell: pwsh
        run: |
          $size = (Get-Item target\release\vong.exe).Length
          Write-Output "Binary size: $size bytes ($([math]::Round($size/1MB,1)) MB)"
          if ($size -gt 15728640) {
            Write-Output "::error::Binary size $size exceeds 15 MB target"
            exit 1
          }

  build-macos:
    name: Build (macOS — scaffolding only, paused)
    runs-on: macos-latest
    # Windows-first pivot: macOS feature work paused, but cross-compile sanity
    # check keeps `#[cfg(target_os = "macos")]` gates honest.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        working-directory: app
        run: cargo build --workspace

  security:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit + cargo-deny
        run: |
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny

      - name: Cargo audit (CVE check)
        working-directory: app
        run: cargo audit --deny warnings

      - name: Cargo deny (license + policy)
        working-directory: app
        run: cargo deny check
